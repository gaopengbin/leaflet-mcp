name: Bug Report
description: 报告一个 bug / Report a bug
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: 现象 / What happened
      description: 简要描述 bug
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤 / Steps to reproduce
      placeholder: |
        1. 启动 `npx leaflet-mcp-runtime`
        2. 调用工具 `xxx`，参数 `{...}`
        3. 期望 ... 实际 ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本 / Version
      placeholder: leaflet-mcp-runtime@0.1.0, leaflet 1.9.4
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: 环境 / Environment
      placeholder: Node.js 20.11, Windows 11, Chrome 130
